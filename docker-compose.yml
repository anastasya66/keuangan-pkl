# ============================================================
#  FinToko — Docker Compose v3.8
#  Services: web (PHP/Apache) · db (MySQL 8) · phpmyadmin
#  Environment: Development / Production-Ready
#
#  ⛔ SECURITY: Semua kredensial diambil dari file .env
#  Salin .env.example ke .env dan isi dengan nilai yang aman.
# ============================================================

version: '3.8'

# -----------------------------------------------------------
# Services
# -----------------------------------------------------------
services:

  # ----------------------------------------------------------
  # WEB SERVICE — PHP 8.2 + Apache
  # ----------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fintoko-web:latest
    container_name: fintoko_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html          # Hot-reload for development
    environment:
      TZ: Asia/Jakarta
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fintoko_net

  # ----------------------------------------------------------
  # DATABASE SERVICE — MySQL 8.0
  # ----------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: fintoko_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: Asia/Jakarta
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fintoko_net

  # ----------------------------------------------------------
  # PHPMYADMIN — Database GUI (development only)
  # ----------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: fintoko_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Jakarta
    depends_on:
      - db
    networks:
      - fintoko_net

# -----------------------------------------------------------
# Networks
# -----------------------------------------------------------
networks:
  fintoko_net:
    driver: bridge
    name: fintoko_network

# -----------------------------------------------------------
# Volumes
# -----------------------------------------------------------
volumes:
  db_data:
    driver: local
    name: fintoko_db_data
