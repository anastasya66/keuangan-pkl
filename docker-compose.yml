services:
  # =========================================================================
  # App Service: PHP 8.2-FPM (Menggunakan file .env utama secara terpadu)
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintoko_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "${APP_NAME:-FinToko}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "http://localhost:${FORWARD_NGINX_PORT:-8080}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DOCKER_DB_HOST:-mariadb}"
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-fintoko_db}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      SEED_DATABASE: "${SEED_DATABASE:-false}"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - fintoko_network

  # =========================================================================
  # Nginx Service: Reverse Proxy & Web Server
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: fintoko_nginx
    restart: unless-stopped
    ports:
      - "${FORWARD_NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - fintoko_network

  # =========================================================================
  # MariaDB Service: Database Terisolasi (Otomatis cocok dengan .env utama)
  # =========================================================================
  mariadb:
    image: mariadb:10.11
    container_name: fintoko_mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-fintoko_db}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-}"
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - fintoko_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fintoko_network

# =========================================================================
# Shared Network & Persistent Volumes
# =========================================================================
networks:
  fintoko_network:
    driver: bridge

volumes:
  fintoko_mariadb_data:
    driver: local
