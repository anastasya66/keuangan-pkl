server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ⛔ SECURITY: Blokir eksekusi PHP di folder uploads
    # Mencegah upload shell/webshell yang dieksekusi sebagai PHP
    location ~* ^/uploads/ {
        # Hanya izinkan file statis (gambar, PDF)
        location ~* \.(jpg|jpeg|png|gif|webp|pdf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Blokir semua file PHP atau file lain di folder uploads
        location ~* \.php$ {
            deny all;
            return 403;
        }
    }

    # ⛔ SECURITY: Blokir akses langsung ke file sensitif
    location ~* (\.env|\.git|\.htaccess|composer\.(json|lock)|\.sql)$ {
        deny all;
        return 404;
    }

    # ⛔ SECURITY: Blokir akses ke folder config dan database
    location ~* ^/(config|database|auth)/ {
        # Izinkan hanya PHP-FPM yang memproses, bukan akses langsung
        location ~* \.php$ {
            include fastcgi_params;
            fastcgi_pass php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_index index.php;
        }
        # Blokir file non-PHP di folder sensitif
        deny all;
        return 404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }

    # Static assets cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
